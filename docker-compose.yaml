services:
  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: modern_dentistry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "012345"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - modern-net

  redis-server:
    image: redis:alpine
    container_name: redis-server
    restart: always
    command: redis-server --save "" --appendonly no --stop-writes-on-bgsave-error no
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - modern-net

  modern-dentistry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modern-dentistry
    restart: always
    depends_on:
      - postgres-db
      - redis-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:+UseG1GC -XX:+UseStringDeduplication -Xms512m -Xmx1536m -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom"
    ports:
      - "5555:5555"
    volumes:
      - "/home/media:/app/media"
    networks:
      - modern-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/media:/home/media:ro
      - /var/www/frontend:/var/www/frontend:ro
    depends_on:
      - modern-dentistry
    networks:
      - modern-net

networks:
  modern-net:
    driver: bridge

volumes:
  postgres_data: