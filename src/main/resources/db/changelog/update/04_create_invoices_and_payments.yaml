databaseChangeLog:
  - changeSet:
      id: 04_create_invoices_and_payments
      author: antigravity
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: deleted_by
                  type: VARCHAR(255)
              - column:
                  name: created_date
                  type: BIGINT
              - column:
                  name: updated_date
                  type: BIGINT
              - column:
                  name: deleted_date
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: action_status
                  type: VARCHAR(50)
              - column:
                  name: invoice_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: doctor_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: issue_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: vat_rate
                  type: DECIMAL(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: vat_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: invoice_status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: deleted_by
                  type: VARCHAR(255)
              - column:
                  name: created_date
                  type: BIGINT
              - column:
                  name: updated_date
                  type: BIGINT
              - column:
                  name: deleted_date
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: action_status
                  type: VARCHAR(50)
              - column:
                  name: invoice_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: payment_date
                  type: DATE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            constraintName: fk_invoices_patient
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: doctor_id
            referencedTableName: base_users
            referencedColumnNames: id
            constraintName: fk_invoices_doctor
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: invoice_id
            referencedTableName: invoices
            referencedColumnNames: id
            constraintName: fk_payments_invoice
            onDelete: CASCADE

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_patient_id
            columns:
              - column:
                  name: patient_id
        - createIndex:
            tableName: invoices
            indexName: idx_invoices_doctor_id
            columns:
              - column:
                  name: doctor_id
        - createIndex:
            tableName: invoices
            indexName: idx_invoices_status
            columns:
              - column:
                  name: invoice_status
        - createIndex:
            tableName: payments
            indexName: idx_payments_invoice_id
            columns:
              - column:
                  name: invoice_id
